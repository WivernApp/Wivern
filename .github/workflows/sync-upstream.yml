name: Sync upstream SillyTavern

on:
  schedule:
    # Check for upstream updates daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "WivernApp"
          git config user.email "wivernapp@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/SillyTavern/SillyTavern.git

      - name: Fetch upstream
        run: git fetch upstream release

      - name: Check for new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/release)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Already up to date"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git rev-list HEAD..upstream/release --count)
            echo "$COUNT new commits from upstream"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=$COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge upstream/release --no-edit || {
            echo "::warning::Merge conflict detected. Manual resolution required."
            git merge --abort
            exit 1
          }

      - name: Push
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin release

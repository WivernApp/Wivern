name: Build APK

on:
  push:
    branches: [release]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'screenshot*.png'
      - 'wivern.png'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Babel unicode-property-regex plugin
        run: npm install @babel/core @babel/plugin-transform-unicode-property-regex

      - name: Patch Unicode property escapes
        run: node fix-unicode-regex.mjs

      - name: Create sillytavern.zip
        run: |
          zip -r /tmp/sillytavern.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "android/*" \
            -x "backups/*" \
            -x "docker/*" \
            -x "test-results/*" \
            -x ".vscode/*" \
            -x ".idea/*" \
            -x "*.colab" \
            -x "node_modules/.cache/*" \
            -x "screenshot*.png" \
            -x "icudt74l.dat"
          mkdir -p android/app/src/main/assets
          mv /tmp/sillytavern.zip android/app/src/main/assets/sillytavern.zip
          echo "Zip size: $(du -h android/app/src/main/assets/sillytavern.zip | cut -f1)"

      - name: Download nodejs-mobile binaries
        run: |
          curl -L -o /tmp/nodejs-mobile.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p android/app/libnode
          unzip -q /tmp/nodejs-mobile.zip -d android/app/libnode
          rm /tmp/nodejs-mobile.zip

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Wivern-${TAG}.apk"
          echo "APK_PATH=Wivern-${TAG}.apk" >> "$GITHUB_ENV"
          echo "Renamed to Wivern-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PATH }}
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Wivern ${{ github.ref_name }}
          body: |
            Wivern ${{ github.ref_name }} — SillyTavern on Android

            Download the APK below and sideload it on your Android device.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
